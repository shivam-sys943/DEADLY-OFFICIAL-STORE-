<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEADLY OFFICIAL STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b0b0b;
color:white;
min-height:100vh;
}

header{
background:#111;
padding:18px;
text-align:center;
font-size:24px;
font-weight:700;
color:#00bfff;
box-shadow:0 0 15px rgba(0,191,255,0.4);
position:sticky;
top:0;
z-index:100;
}

.container{
width:95%;
max-width:1100px;
margin:auto;
padding:20px 0;
}

.top-box{
background:#151515;
padding:20px;
border-radius:18px;
margin-bottom:20px;
border:1px solid #222;
}

.top-box h2{
margin-bottom:15px;
color:#00bfff;
}

input{
width:100%;
padding:14px;
margin-top:10px;
border:none;
outline:none;
border-radius:12px;
background:#222;
color:white;
font-size:15px;
}

.check-btn{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00bfff;
color:white;
font-weight:700;
font-size:15px;
cursor:pointer;
}

#result{
margin-top:15px;
color:lime;
font-weight:600;
}

.packs-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-top:20px;
}

.pack-card{
background:#151515;
border:1px solid #222;
border-radius:18px;
padding:18px;
text-align:center;
transition:0.3s;
box-shadow:0 0 12px rgba(0,191,255,0.08);
}

.pack-card:hover{
transform:translateY(-4px);
box-shadow:0 0 20px rgba(0,191,255,0.3);
}

.diamond{
font-size:19px;
font-weight:700;
margin-bottom:10px;
color:#00bfff;
}

.price{
font-size:22px;
font-weight:700;
margin-bottom:14px;
}

.pack-card button{
background:#00bfff;
border:none;
padding:11px;
width:100%;
border-radius:12px;
font-weight:700;
color:white;
cursor:pointer;
}

.payment-page{
margin-top:25px;
background:#151515;
padding:22px;
border-radius:18px;
display:none;
border:1px solid #222;
}

.payment-page h2{
text-align:center;
margin-bottom:15px;
color:#00bfff;
}

.pay-box{
text-align:center;
}

.qr{
width:240px;
border-radius:18px;
margin:20px 0;
border:4px solid #222;
}

.upi-text{
color:#aaa;
margin-bottom:18px;
}

.confirm-btn{
background:limegreen;
border:none;
padding:14px;
width:100%;
border-radius:12px;
font-weight:700;
color:white;
cursor:pointer;
}

.receipt{
margin-top:20px;
background:#111;
padding:18px;
border-radius:16px;
line-height:2;
border:1px solid #222;
display:none;
}

.status-pending{
color:orange;
font-weight:700;
}

.status-success{
color:lime;
font-weight:700;
}

.orders{
margin-top:20px;
background:#151515;
padding:15px;
border-radius:15px;
text-align:center;
color:lime;
font-weight:600;
}

.admin-login,
.admin-panel{
margin-top:25px;
background:#151515;
padding:20px;
border-radius:18px;
border:1px solid #222;
}

.admin-panel h2,
.admin-login h2{
margin-bottom:15px;
color:#00bfff;
}

.admin-order{
background:#111;
padding:15px;
border-radius:14px;
margin-top:15px;
line-height:1.8;
border:1px solid #222;
}

.success-btn{
background:limegreen;
border:none;
padding:12px;
width:100%;
border-radius:10px;
margin-top:10px;
font-weight:700;
color:white;
cursor:pointer;
}

footer{
text-align:center;
padding:25px;
color:#666;
font-size:14px;
}

</style>
</head>
<body>

<header>
DEADLY OFFICIAL STORE
</header>

<div class="container">

<div class="top-box">

<h2>MLBB Name Checker</h2>

<input type="text" id="uid" placeholder="Enter MLBB User ID">

<input type="text" id="zone" placeholder="Enter Server ID">

<button class="check-btn" onclick="checkName()">
CHECK USERNAME
</button>

<p id="result"></p>

</div>

<div class="packs-grid">

<div class="pack-card">
<div class="diamond">💎 86</div>
<div class="price">₹120</div>
<button onclick="selectProduct('86 Diamonds - ₹120')">BUY</button>
</div>

<div class="pack-card">
<div class="diamond">💎 172</div>
<div class="price">₹240</div>
<button onclick="selectProduct('172 Diamonds - ₹240')">BUY</button>
</div>

<div class="pack-card">
<div class="diamond">💎 257</div>
<div class="price">₹350</div>
<button onclick="selectProduct('257 Diamonds - ₹350')">BUY</button>
</div>

<div class="pack-card">
<div class="diamond">💎 344</div>
<div class="price">₹470</div>
<button onclick="selectProduct('344 Diamonds - ₹470')">BUY</button>
</div>

<div class="pack-card">
<div class="diamond">💎 706</div>
<div class="price">₹940</div>
<button onclick="selectProduct('706 Diamonds - ₹940')">BUY</button>
</div>

<div class="pack-card">
<div class="diamond">WEEKLY PASS</div>
<div class="price">₹145</div>
<button onclick="selectProduct('Weekly Pass - ₹145')">BUY</button>
</div>

<div class="pack-card">
<div class="diamond">STARLIGHT</div>
<div class="price">₹300</div>
<button onclick="selectProduct('Starlight Membership - ₹300')">BUY</button>
</div>

</div>

<div class="payment-page" id="paymentPage">

<h2>Complete Payment</h2>

<div class="pay-box">

<p id="selectedPack"></p>

<img src="https://i.imgur.com/2s9X8Zx.png" class="qr">

<p class="upi-text">
Scan QR & Complete Payment
</p>

<button class="confirm-btn" onclick="confirmPayment()">
I PAID
</button>

</div>

</div>

<div class="receipt" id="receipt"></div>

<div class="orders" id="liveOrders">
Recent Order Loading...
</div>

<div class="admin-login">

<h2>ADMIN PANEL</h2>

<input type="password"
id="adminPassword"
placeholder="Enter Admin Password">

<button class="check-btn"
onclick="loginAdmin()">
LOGIN
</button>

</div>

<div class="admin-panel"
id="adminPanel"
style="display:none;">

<h2>ORDER CONTROL PANEL</h2>

<div id="adminOrders"></div>

</div>

</div>

<footer>
© DEADLY OFFICIAL STORE
</footer>

<script>

let selectedProduct = "";

async function checkName(){

let uid = document.getElementById("uid").value;
let zone = document.getElementById("zone").value;

document.getElementById("result").innerHTML =
"Checking...";

let apis = [

`https://api.isan.eu.org/nickname/ml?id=${uid}&zone=${zone}`,

`https://api.isan.eu.org/nickname/ml?id=${uid}&server=${zone}`

];

let success = false;

for(let api of apis){

try{

let response = await fetch(api);

let data = await response.json();

let username =
data.nickname ||
data.name ||
data.username;

if(username){

document.getElementById("result").innerHTML =
"Username: " + username;

success = true;

break;

}

}catch(err){}

}

if(!success){

document.getElementById("result").innerHTML =
"API Busy or Player Not Found";

}

}

function selectProduct(product){

selectedProduct = product;

document.getElementById("paymentPage").style.display =
"block";

document.getElementById("selectedPack").innerHTML =
"Selected Pack: " + product;

window.scrollTo({
top:document.body.scrollHeight,
behavior:'smooth'
});

}

function confirmPayment(){

let uid = document.getElementById("uid").value;
let zone = document.getElementById("zone").value;

if(uid == "" || zone == ""){

alert("Enter MLBB ID & Server ID");

return;

}

let orderId = "ORD" + Date.now();

let order = {

id:orderId,
uid:uid,
zone:zone,
product:selectedProduct,
status:"PENDING"

};

let orders =
JSON.parse(localStorage.getItem("orders") || "[]");

orders.push(order);

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

let receipt = `
<h2>PAYMENT RECEIPT</h2>

<br>

Order ID: ${orderId}<br>

MLBB ID: ${uid}<br>

Server ID: ${zone}<br>

Pack: ${selectedProduct}<br>

Status:
<span class="status-pending">
PENDING
</span>
`;

document.getElementById("receipt").style.display =
"block";

document.getElementById("receipt").innerHTML =
receipt;

loadOrders();

let msg =
`Hello DEADLY OFFICIAL STORE,

I PAID for:

${selectedProduct}

Order ID: ${orderId}

MLBB ID: ${uid}
SERVER ID: ${zone}

Please process my order.`;

window.open(
`https://wa.me/918787821704?text=${encodeURIComponent(msg)}`,
'_blank'
);

}

function loginAdmin(){

let pass =
document.getElementById("adminPassword").value;

if(pass == "RUPAM120"){

document.getElementById("adminPanel")
.style.display = "block";

loadOrders();

}else{

alert("Wrong Password");

}

}

function loadOrders(){

let orders =
JSON.parse(localStorage.getItem("orders") || "[]");

let adminOrders =
document.getElementById("adminOrders");

adminOrders.innerHTML = "";

orders.reverse().forEach((order,index)=>{

adminOrders.innerHTML += `

<div class="admin-order">

Order ID: ${order.id}<br>

MLBB ID: ${order.uid}<br>

Server ID: ${order.zone}<br>

Pack: ${order.product}<br>

Status:

<span class="${
order.status == "SUCCESS"
? "status-success"
: "status-pending"
}">

${order.status}

</span>

${
order.status == "PENDING"
?

`<button class="success-btn"
onclick="markSuccess('${order.id}')">
MARK SUCCESS
</button>`

:

""

}

</div>

`;

});

}

function markSuccess(orderId){

let orders =
JSON.parse(localStorage.getItem("orders") || "[]");

orders.forEach(order=>{

if(order.id == orderId){

order.status = "SUCCESS";

}

});

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

loadOrders();

}

let fakeOrders = [

"Rahul purchased Weekly Pass",
"Akash purchased 86 Diamonds",
"Sahil purchased 706 Diamonds",
"Rohan purchased Twilight Pass",
"Ankit purchased 257 Diamonds",
"Vikram purchased Starlight"

];

let x = 0;

setInterval(()=>{

document.getElementById("liveOrders").innerHTML =
"Recent Order: " + fakeOrders[x];

x++;

if(x >= fakeOrders.length){

x = 0;

}

},2000);

</script>

</body>
</html>
