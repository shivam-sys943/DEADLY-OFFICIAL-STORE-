<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEADLY OFFICIAL STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b0b0b;
color:white;
min-height:100vh;
}

header{
background:#111;
padding:18px;
text-align:center;
font-size:24px;
font-weight:700;
color:#00bfff;
box-shadow:0 0 15px rgba(0,191,255,0.4);
position:sticky;
top:0;
z-index:100;
}

.container{
width:95%;
max-width:1100px;
margin:auto;
padding:20px 0;
}

.card{
background:#151515;
padding:20px;
border-radius:18px;
margin-bottom:20px;
border:1px solid #222;
}

.card h2{
margin-bottom:15px;
color:#00bfff;
}

input{
width:100%;
padding:14px;
margin-top:10px;
border:none;
outline:none;
border-radius:12px;
background:#222;
color:white;
font-size:15px;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:12px;
background:#00bfff;
color:white;
font-weight:700;
cursor:pointer;
font-size:15px;
}

.google-btn{
background:#db4437;
}

.packs-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-top:20px;
}

.pack-card{
background:#151515;
border:1px solid #222;
border-radius:18px;
padding:18px;
text-align:center;
transition:0.3s;
box-shadow:0 0 12px rgba(0,191,255,0.08);
}

.pack-card:hover{
transform:translateY(-4px);
box-shadow:0 0 20px rgba(0,191,255,0.3);
}

.diamond{
font-size:18px;
font-weight:700;
margin-bottom:10px;
color:#00bfff;
}

.price{
font-size:22px;
font-weight:700;
margin-bottom:12px;
}

.receipt{
margin-top:20px;
background:#111;
padding:18px;
border-radius:16px;
line-height:2;
border:1px solid #222;
display:none;
}

.pending{
color:orange;
font-weight:bold;
}

.success{
color:lime;
font-weight:bold;
}

.orders{
margin-top:20px;
background:#151515;
padding:15px;
border-radius:15px;
text-align:center;
color:lime;
font-weight:600;
}

.admin{
display:none;
}

.order-item{
background:#111;
padding:15px;
border-radius:14px;
margin-top:15px;
line-height:1.8;
border:1px solid #222;
}

.success-btn{
background:limegreen;
}

.qr{
width:230px;
margin-top:20px;
border-radius:18px;
}

footer{
text-align:center;
padding:20px;
color:#777;
}

</style>
</head>
<body>

<header>
DEADLY OFFICIAL STORE
</header>

<div class="container">

<div class="card">

<h2>LOGIN PANEL</h2>

<input type="email"
id="loginEmail"
placeholder="Enter Gmail">

<input type="password"
id="loginPassword"
placeholder="Enter Password">

<button onclick="loginSystem()">
LOGIN
</button>

<button class="google-btn"
onclick="googleLogin()">
LOGIN WITH GOOGLE
</button>

<p id="loginStatus"
style="margin-top:10px;color:#aaa;">
</p>

</div>

<div class="card">

<h2>MLBB Name Checker</h2>

<input type="text"
id="uid"
placeholder="Enter MLBB User ID">

<input type="text"
id="zone"
placeholder="Enter Server ID">

<button onclick="checkName()">
CHECK USERNAME
</button>

<p id="result"
style="margin-top:15px;color:lime;">
</p>

</div>

<div class="packs-grid">

<div class="pack-card">
<div class="diamond">💎 86</div>
<div class="price">₹120</div>
<button onclick="selectProduct('86 Diamonds - ₹120')">
BUY
</button>
</div>

<div class="pack-card">
<div class="diamond">💎 172</div>
<div class="price">₹240</div>
<button onclick="selectProduct('172 Diamonds - ₹240')">
BUY
</button>
</div>

<div class="pack-card">
<div class="diamond">💎 257</div>
<div class="price">₹350</div>
<button onclick="selectProduct('257 Diamonds - ₹350')">
BUY
</button>
</div>

<div class="pack-card">
<div class="diamond">💎 344</div>
<div class="price">₹470</div>
<button onclick="selectProduct('344 Diamonds - ₹470')">
BUY
</button>
</div>

<div class="pack-card">
<div class="diamond">💎 706</div>
<div class="price">₹940</div>
<button onclick="selectProduct('706 Diamonds - ₹940')">
BUY
</button>
</div>

<div class="pack-card">
<div class="diamond">WEEKLY PASS</div>
<div class="price">₹145</div>
<button onclick="selectProduct('Weekly Pass - ₹145')">
BUY
</button>
</div>

<div class="pack-card">
<div class="diamond">STARLIGHT</div>
<div class="price">₹300</div>
<button onclick="selectProduct('Starlight Membership - ₹300')">
BUY
</button>
</div>

</div>

<div class="card"
id="paymentBox"
style="display:none;">

<h2>COMPLETE PAYMENT</h2>

<p id="selectedPack"></p>

<center>

<img src="https://i.imgur.com/2s9X8Zx.png"
class="qr">

</center>

<button onclick="confirmPayment()">
I PAID
</button>

</div>

<div class="receipt"
id="receipt"></div>

<div class="orders"
id="liveOrders">

Recent Order Loading...

</div>

<div class="card admin"
id="adminPanel">

<h2>ADMIN PANEL</h2>

<p>Total Visits:
<span id="visits"></span>
</p>

<p>Total Orders:
<span id="totalOrders"></span>
</p>

<div id="adminOrders"></div>

</div>

</div>

<footer>
© DEADLY OFFICIAL STORE
</footer>

<script>

let visits =
localStorage.getItem("visits") || 0;

visits++;

localStorage.setItem("visits", visits);

let orders =
JSON.parse(localStorage.getItem("orders") || "[]");

let selectedProduct = "";

async function checkName(){

let uid =
document.getElementById("uid").value;

let zone =
document.getElementById("zone").value;

document.getElementById("result").innerHTML =
"Checking...";

let apis = [

`https://api.isan.eu.org/nickname/ml?id=${uid}&zone=${zone}`,

`https://api.isan.eu.org/nickname/ml?id=${uid}&server=${zone}`

];

let success = false;

for(let api of apis){

try{

let response = await fetch(api);

let data = await response.json();

let username =
data.nickname ||
data.name ||
data.username;

if(username){

document.getElementById("result").innerHTML =
"Username: " + username;

success = true;

break;

}

}catch(err){}

}

if(!success){

document.getElementById("result").innerHTML =
"API Busy or Player Not Found";

}

}

function selectProduct(product){

selectedProduct = product;

document.getElementById("paymentBox")
.style.display = "block";

document.getElementById("selectedPack")
.innerHTML =
"Selected Pack: " + product;

window.scrollTo({
top:document.body.scrollHeight,
behavior:'smooth'
});

}

function confirmPayment(){

let uid =
document.getElementById("uid").value;

let zone =
document.getElementById("zone").value;

if(uid == "" || zone == ""){

alert("Enter MLBB ID & Server ID");

return;

}

let orderId = "ORD" + Date.now();

let order = {

id:orderId,
uid:uid,
zone:zone,
product:selectedProduct,
status:"PENDING"

};

orders.push(order);

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

let receipt = `
<h2>PAYMENT RECEIPT</h2>

<br>

Order ID: ${orderId}<br>

MLBB ID: ${uid}<br>

Server ID: ${zone}<br>

Pack: ${selectedProduct}<br>

Status:
<span class="pending">
PENDING
</span>
`;

document.getElementById("receipt")
.style.display = "block";

document.getElementById("receipt")
.innerHTML = receipt;

loadOrders();

let msg =
`Hello DEADLY OFFICIAL STORE,

I PAID for:

${selectedProduct}

Order ID: ${orderId}

MLBB ID: ${uid}
SERVER ID: ${zone}

Please process my order.`;

window.open(
`https://wa.me/918787821704?text=${encodeURIComponent(msg)}`,
'_blank'
);

}

function loginSystem(){

let email =
document.getElementById("loginEmail").value;

let password =
document.getElementById("loginPassword").value;

if(
email ==
"deadlyofficialstore@gmail.com"
&&
password ==
"RUPAM120"
){

localStorage.setItem(
"adminLoggedIn",
"true"
);

document.getElementById("adminPanel")
.style.display = "block";

loadOrders();

document.getElementById("loginStatus")
.innerHTML =
"Admin Login Successful";

}else{

localStorage.setItem(
"adminLoggedIn",
"false"
);

document.getElementById("loginStatus")
.innerHTML =
"Customer Login Successful";

alert("Customer Login Successful");

}

}

function loadOrders(){

let orders =
JSON.parse(localStorage.getItem("orders") || "[]");

let adminOrders =
document.getElementById("adminOrders");

adminOrders.innerHTML = "";

orders.reverse().forEach((order,index)=>{

adminOrders.innerHTML += `

<div class="order-item">

Order ID: ${order.id}<br>

MLBB ID: ${order.uid}<br>

Server ID: ${order.zone}<br>

Pack: ${order.product}<br>

Status:

<span class="${
order.status == "SUCCESS"
? "success"
: "pending"
}">

${order.status}

</span>

${
order.status == "PENDING"
?

`<button class="success-btn"
onclick="markSuccess('${order.id}')">
MARK SUCCESS
</button>`

:

""

}

</div>

`;

});

document.getElementById("visits")
.innerHTML = visits;

document.getElementById("totalOrders")
.innerHTML = orders.length;

}

function markSuccess(orderId){

let orders =
JSON.parse(localStorage.getItem("orders") || "[]");

orders.forEach(order=>{

if(order.id == orderId){

order.status = "SUCCESS";

}

});

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

loadOrders();

}

window.onload = function(){

if(
localStorage.getItem("adminLoggedIn")
== "true"
){

document.getElementById("adminPanel")
.style.display = "block";

loadOrders();

}

}

let fakeOrders = [

"Rahul purchased Weekly Pass",

"Akash purchased 86 Diamonds",

"Sahil purchased 706 Diamonds",

"Rohan purchased Twilight Pass",

"Ankit purchased 257 Diamonds",

"Vikram purchased Starlight"

];

let x = 0;

setInterval(()=>{

document.getElementById("liveOrders")
.innerHTML =
"Recent Order: " + fakeOrders[x];

x++;

if(x >= fakeOrders.length){

x = 0;

}

},2000);

</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDvx2NgreqoQo4SFgbR-PGKDSDfs_ZMlP0",

authDomain: "deadly-official-store.firebaseapp.com",

projectId: "deadly-official-store",

storageBucket: "deadly-official-store.firebasestorage.app",

messagingSenderId: "645553796088",

appId: "1:645553796088:web:6cf67888ec2709f0ca9c0d",

measurementId: "G-Z7FBP88J9X"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

window.googleLogin = async function(){

try{

const result =
await signInWithPopup(auth, provider);

const user = result.user;

alert(
"Logged in as " +
user.displayName
);

if(
user.email ==
"deadlyofficialstore@gmail.com"
){

document.getElementById("adminPanel")
.style.display = "block";

loadOrders();

}

}catch(error){

alert(error.message);

}

}

</script>

</body>
</html>
